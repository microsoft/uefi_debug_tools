name: "Package Scripts"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runs-on: windows-2022
          - platform: arm64
            runs-on: windows-11-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.platform }}

      - name: Install dependencies
        run: pip install -r pip-requirements.txt

      - name: Run pywin32 post-install
        run: python "$env:pythonLocation\Scripts\pywin32_postinstall.py" -install

      - name: Build ComToTcpServer binary
        run: pyinstaller --onefile --name ComToTcpServer --collect-all pywin32 Scripts\ComToTcpServer.py

      - name: Publish Release Asset
        if: ${{ github.event_name == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path dist\ComToTcpServer.exe -DestinationPath Scripts_${{ matrix.platform }}.zip
          gh release upload ${{ github.event.release.tag_name }} Scripts_${{ matrix.platform }}.zip
